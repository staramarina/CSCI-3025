[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "module9-assignment"
version = "1.0.0"
description = "Personal Expense Tracker"
authors = [{name = "Tiffany M. Mui"}]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.21.6",
    "pandas>=2.0.3",
    "seaborn>=0.12.2",
    "matplotlib>=3.5.3"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers"
]
markers = [
    "slow: marks tests as slow",
    "integration: marks integration tests"
]
filterwarnings = [
    "ignore::DeprecationWarning"
]

[tool.coverage.run]
source = ["."]
omit = ["tests/*"]

[tool.black]
line-length = 79
target-version = ["py314"]
include = '\.py$'
exclude = '''
/(
    \.git
    | __pycache__
)/
'''