[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Module 7 Assignment"
version = "1.0.0"
description = "Weather tool"
authors = [{name = "Tiffany M. Mui"}]
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0.0",
    "requests>=2.31.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers"
]
markers = [
    "slow: marks tests as slow",
    "integration: marks integration tests"
]
filterwarnings = [
    "ignore::DeprecationWarning"
]

[tool.coverage.run]
source = ["."]
omit = ["tests/*"]

[tool.black]
line-length = 79
target-version = ["py314"]
include = '\.py?$'
exclude = '''
/(
    \.git
    | __pycache__
)/
'''